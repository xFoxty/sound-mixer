name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Sound Mixer ${{ github.ref_name }}
          body: |
            ### Sound Mixer ${{ github.ref_name }}

            Minecraft 26.2 · Fabric Loader 0.19.3+ · Fabric API 0.156.0+26.2 · Java 25

            - Per-sound volume from 0% to 200%
            - Search by Chinese/English name, ID or path keywords
            - Category filters and a modified-only view
            - Reset one sound or all sounds (with confirmation)
            - Mod Menu integration and a rebindable `K` shortcut
            - Full English and Chinese names for all 1968 vanilla sound events

            **Install:** put `sound-mixer-1.1.0.jar` into `.minecraft/mods/`.
            Delete older Sound Mixer versions first.

            **安装：** 将 `sound-mixer-1.1.0.jar` 放入 `.minecraft/mods/`，并先删除旧版本。
          files: |
            build/libs/sound-mixer-1.1.0.jar
            build/libs/sound-mixer-1.1.0-sources.jar
          fail_on_unmatched_files: true
